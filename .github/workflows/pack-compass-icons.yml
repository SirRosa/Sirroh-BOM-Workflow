name: Package Compass Icon Sets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'IconPacks/manifest.json'
      - 'pack_compass_icons.py'
      - '.github/workflows/pack-compass-icons.yml'

permissions:
  contents: write

concurrency:
  group: compass-packs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack-icons:
    name: Create and publish icon ZIP sets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and verify all themed ZIP files
        run: python pack_compass_icons.py
      - name: Upload archives as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-icons-zips
          path: |
            IconPacks/Zips/*.zip
            IconPacks/README.md
          if-no-files-found: error
      - name: Commit and publish individual ZIP archives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add IconPacks/Zips/ IconPacks/README.md
          if git diff --cached --quiet; then
            echo 'No archive changes required.'
          else
            git commit -m 'Package Compass icon sets into thematic ZIPs [skip ci]'
            git push
          fi
