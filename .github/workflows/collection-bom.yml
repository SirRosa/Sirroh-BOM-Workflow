name: BOM - Pelna kolekcja bez stworzen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collection_pipeline.py'
      - 'collection_categories.py'
      - '.github/workflows/collection-bom.yml'

permissions:
  contents: write

concurrency:
  group: bom-collection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-collection:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install BOM v8 dependencies
        run: python -m pip install -r requirements.txt
      - name: Run four stages and verify original icons untouched
        run: python collection_pipeline.py
      - name: Publish atlas, labeled preview, all icons and reports
        uses: actions/upload-artifact@v4
        with:
          name: bom-collection-${{ github.run_number }}
          path: collection_results/
          if-no-files-found: error
      - name: Save generated collection to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection_results/ IconsForCompass/
          if git diff --cached --quiet; then
            echo 'Collection output unchanged.'
          else
            git commit -m 'BOM: process current non-creature icon collection [skip ci]'
            git push
          fi
