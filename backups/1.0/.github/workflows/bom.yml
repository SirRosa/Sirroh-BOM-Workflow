name: BOM - Przetwarzanie atlasow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'input/**'
      - 'src/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/bom.yml'

permissions:
  contents: write

concurrency:
  group: bom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Run B&om on input atlases
        run: python src/bom_icons.py --input-dir input --output-dir output
      - name: Publish PNG + JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bom-output-${{ github.run_number }}
          path: output/
          if-no-files-found: error
      - name: Commit PNG and processing reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/
          if git diff --cached --quiet; then
            echo 'Output unchanged.'
          else
            git commit -m 'BOM: update generated atlases [skip ci]'
            git push
          fi
